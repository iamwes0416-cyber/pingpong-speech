<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Table Tennis Dream 練習</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ef;--card:#fff;--ink:#2b2b3a;--muted:#7a7a8c;--accent:#e4572e;--accent2:#2e86ab;--soft:#ffe9d6;--line:#eee3d3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Noto Sans TC",sans-serif}
header{background:linear-gradient(135deg,#e4572e,#f3a712);color:#fff;padding:22px 18px 18px;text-align:center}
header h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:6px 0 0;opacity:.92;font-size:.95rem}
.player{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.row+.row{margin-top:10px}
button{font:inherit;border:0;cursor:pointer;border-radius:999px}
#play{width:52px;height:52px;background:var(--accent);color:#fff;font-size:1.4rem;flex:none}
#seek{flex:1;min-width:140px;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:88px;text-align:right}
.label{font-size:.85rem;color:var(--muted)}
.speeds button{padding:6px 12px;background:var(--soft);color:var(--ink);font-weight:700}
.speeds button.on{background:var(--accent2);color:#fff}
.toggles label{display:inline-flex;align-items:center;gap:5px;background:#f3efe7;padding:6px 11px;border-radius:999px;font-size:.88rem;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.tip{background:#eef6fa;border-radius:12px;padding:10px 14px;font-size:.9rem;color:#285a70;margin-bottom:14px}
.para{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.line{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.say{flex:none;width:30px;height:30px;background:var(--soft);color:var(--accent);font-size:.8rem;margin-top:2px}
.say.speaking{background:var(--accent);color:#fff}
.en{font-size:1.28rem;line-height:1.6}
.w{cursor:pointer;border-radius:5px;padding:0 1px}
.w:hover{background:#fff1c9}
.w.has{border-bottom:2px dotted #f3a712}
.w.active{background:#ffd666}
.zh{display:block;font-size:.95rem;color:var(--muted);margin-top:2px}
.cue{display:block;font-size:.9rem;color:#b5401c;background:#fff3ec;border-radius:8px;padding:3px 8px;margin-top:4px;width:fit-content}
.line{transition:background .2s}.line.now{background:#ffe08a;border-radius:10px;box-shadow:inset 5px 0 0 #e4572e;padding-left:6px}.line.now .en{font-weight:800}
body.nozh .zh{display:none}
body.nocue .cue{display:none}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);transition:transform .25s;background:#2b2b3a;color:#fff;border-radius:18px;padding:14px 18px;width:min(92vw,420px);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#pop.show{transform:translateX(-50%) translateY(0)}
#pop .top{display:flex;align-items:center;gap:10px}
#pop .word{font-size:1.6rem;font-weight:800}
#pop .again{background:#f3a712;color:#2b2b3a;padding:5px 12px;font-weight:700}
#pop .slow{background:#555;color:#fff;padding:5px 12px}
#pop .close{margin-left:auto;background:none;color:#aaa;font-size:1.3rem}
#pop .mean{margin-top:6px;font-size:1.1rem}
#pop .note{font-size:.85rem;color:#c9c9d6;margin-top:3px}
.warn{display:none;background:#fff3cd;color:#7a5a00;padding:8px 12px;border-radius:10px;font-size:.88rem;margin-bottom:12px}

.ic{width:34px;height:34px;background:#f3efe7;font-size:.95rem;flex:none}
.r2{justify-content:space-between}
.speeds{display:flex;gap:4px;flex-wrap:nowrap}
.pill{padding:5px 11px;background:#e8e0ff;font-size:.85rem}
#settings{display:none;border-top:1px dashed var(--line);padding-top:8px}
#settings.open{display:flex}
.w.has{border-bottom:1.5px dotted #f6c56b}
@media (max-width:600px){
  header{padding:10px 12px}
  header h1{font-size:1.15rem}
  header p{display:none}
  .player{padding:8px 10px}
  .row+.row{margin-top:6px}
  #play{width:42px;height:42px;font-size:1.1rem}
  .time{font-size:.75rem;min-width:66px}
  .speeds button{padding:5px 8px;font-size:.8rem}
  .toggles label{font-size:.8rem;padding:4px 9px}
  main{padding:10px 8px 120px}
  .tip{font-size:.8rem;padding:7px 10px;margin-bottom:8px}
  .para{padding:8px 10px;border-radius:12px;margin-bottom:8px}
  .line{gap:6px;padding:3px 0}
  .say{width:26px;height:26px;font-size:.7rem}
  .en{font-size:1.08rem;line-height:1.5}
  .zh{font-size:.82rem}
  .cue{font-size:.78rem}
}
</style>
</head>
<body>
<header>
  <h1>🏓 My Table Tennis Dream</h1>
  <p>英語演講練習｜點單字聽發音、看中文</p>
</header>

<div class="player">
  <div class="row r1">
    <button id="back5" class="ic" aria-label="倒退5秒">⏪</button>
    <button id="play" aria-label="播放">▶</button>
    <input id="seek" type="range" min="0" max="100" step="0.1" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="row r2">
    <span class="speeds" id="speeds">
      <button data-r="0.6">0.6×</button><button data-r="0.75">0.75×</button><button data-r="0.9">0.9×</button><button data-r="1" class="on">1×</button><button data-r="1.15">1.15×</button>
    </span>
    <button id="gear" class="ic" aria-label="設定">⚙️</button>
  </div>
  <div class="row toggles" id="settings">
    <label><input type="checkbox" id="tzh" checked> 中文</label>
    <label><input type="checkbox" id="tcue" checked> 動作</label>
    <label><input type="checkbox" id="tfollow" checked> 自動捲動</label>
    <button id="calStart" class="pill">🎯 校正</button>
  </div>
</div>

<main>
  <div class="warn" id="warn">🔇 單字沒有聲音嗎？① 如果是從 LINE、FB 等 App 點開，請點右上角選「用 Safari / Chrome 開啟」。② iPhone / iPad 請關掉側邊靜音鍵、調大音量。③ 先按一次上方 ▶ 播放錄音，再點單字試試。</div>
  <div class="tip">👆 <b>點任何單字</b>：聽發音＋看中文。<b>點 🔊</b>：念整句。有黃色虛線的是重點單字。</div>
  <div id="script"></div>
</main>

<div id="cal" style="display:none;position:fixed;inset:auto 0 0 0;background:#2b2b3a;color:#fff;padding:14px;z-index:20;text-align:center">
  <div id="calMsg" style="font-size:1rem;margin-bottom:8px"></div>
  <div id="calNext" style="font-size:1.25rem;color:#ffd666;margin-bottom:10px"></div>
  <button id="calTap" style="width:min(90vw,420px);padding:18px;background:#f3a712;color:#2b2b3a;font-size:1.3rem;font-weight:800">👆 這句開始了！</button>
  <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button id="calUndo" style="padding:6px 14px;background:#555;color:#fff">↩ 退回一句</button>
    <button id="calCancel" style="padding:6px 14px;background:#555;color:#fff">取消</button>
    <button id="calReset" style="padding:6px 14px;background:#555;color:#fff">恢復原本自動切分</button>
  </div>
  <textarea id="calOut" readonly style="display:none;width:min(92vw,520px);height:70px;margin-top:10px;font-size:.75rem"></textarea>
  <div><button id="calCopy" style="display:none;margin-top:6px;padding:6px 14px;background:#2e86ab;color:#fff">📋 複製校正資料</button></div>
</div>

<div id="pop" role="dialog">
  <div class="top">
    <span class="word" id="pword"></span>
    <button class="again" id="pagain">🔊 再聽</button>
    <button class="slow" id="pslow">🐢 慢速</button>
    <button class="close" id="pclose" aria-label="關閉">✕</button>
  </div>
  <div class="mean" id="pmean"></div>
  <div class="note" id="pnote"></div>
</div>

<audio id="audio" src="speech.mp3" preload="metadata"></audio>

// ---------- speech ----------
const synth = window.speechSynthesis;
let voice=null;
function pickVoice(){
  if(!synth)return;
  const vs=synth.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref=["Ana","Aria","Jenny","Samantha","Google US English","Natural"];
  for(const p of pref){const v=vs.find(v=>v.name.includes(p));if(v){voice=v;return;}}
  voice=vs[0]||synth.getVoices().find(v=>/^en/i.test(v.lang))||null;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
else showWarn();
if(/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent))showWarn();

let speakingBtn=null;
function speak(text,rate,btn){
  if(!synth){showWarn();return;}
  if(!voice)pickVoice();
  const busy=synth.speaking||synth.pending;
  if(busy)synth.cancel();
  if(speakingBtn)speakingBtn.classList.remove("speaking");
  const u=new SpeechSynthesisUtterance(text);
  if(voice)u.voice=voice;
  u.lang="en-US";u.rate=rate||0.9;u.volume=1;
  let started=false;u.onstart=()=>{started=true;};
  if(btn){btn.classList.add("speaking");speakingBtn=btn;u.onend=u.onerror=()=>btn.classList.remove("speaking");}
  const go=()=>{try{synth.resume();synth.speak(u);}catch(e){showWarn();}};
  // Safari/Chrome 在 cancel 後立刻 speak 會吞掉語音，稍等一下
  busy?setTimeout(go,120):go();
  setTimeout(()=>{if(!started&&!synth.speaking)showWarn();},2500);
}
function showWarn(){document.getElementById("warn").style.display="block";}

// ---------- word popup ----------
const pop=document.getElementById("pop");let cur="",curT=null,activeEl=null;
function showWord(w,el,wt){
  cur=w;curT=wt;
  if(activeEl)activeEl.classList.remove("active");
  activeEl=el;el.classList.add("active");
  const k=w.toLowerCase();
  document.getElementById("pword").textContent=w;
  document.getElementById("pmean").textContent=DICT[k]||"（點 🔊 聽發音）";
  document.getElementById("pnote").textContent=NOTE[k]?"💡 "+NOTE[k]:"";
  pop.classList.add("show");
  playWord(0.8);
}
function playWord(r){ if(cur.toLowerCase()==="jiayou"){ if(curT) playSeg(curT[0],curT[1],1); return; } if(segEnd!==null){a.pause();clearSeg();} speak(cur,r); }
document.getElementById("pagain").onclick=()=>playWord(0.8);
document.getElementById("pslow").onclick=()=>playWord(0.45);
document.getElementById("pclose").onclick=()=>{pop.classList.remove("show");if(activeEl)activeEl.classList.remove("active");};

// ---------- audio player ----------
const a=document.getElementById("audio"),play=document.getElementById("play"),seek=document.getElementById("seek"),tm=document.getElementById("time");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
let speed=1, segEnd=null, segBtn=null, raf=0;
function clearSeg(){ segEnd=null; cancelAnimationFrame(raf); if(segBtn){segBtn.classList.remove("speaking");segBtn=null;} a.playbackRate=speed; }
function playSeg(s,e,r,btn){
  if(synth)synth.cancel();
  clearSeg();
  a.playbackRate=r; segEnd=e;
  if(btn){btn.classList.add("speaking");segBtn=btn;}
  const go=()=>{ a.currentTime=s; a.play().catch(()=>{});
    const tick=()=>{ if(segEnd===null)return; if(a.currentTime>=segEnd||a.paused){a.pause();clearSeg();return;} raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); };
  if(a.readyState>=1) go(); else { a.addEventListener("loadedmetadata",go,{once:true}); a.load(); }
}
play.onclick=()=>{ if(synth)synth.cancel(); if(segEnd!==null){clearSeg();a.pause();} if(a.paused){a.play().catch(()=>{});}else a.pause(); };
a.onplay=()=>play.textContent="❚❚"; a.onpause=a.onended=()=>play.textContent="▶";
let curLine=-1;
a.ontimeupdate=()=>{ if(!seeking&&a.duration)seek.value=a.currentTime/a.duration*100; tm.textContent=fmt(a.currentTime)+" / "+fmt(a.duration);
  if(segEnd===null){ const t=a.currentTime; let k=-1; for(let i=0;i<TIMING.length;i++){ if(t>=TIMING[i][0]-0.1) k=i; else break; } if(k>=0&&t>TIMING[k][1]+1.5&&k===TIMING.length-1) k=-1;
    if(k!==curLine){ if(curLine>=0)LINES[curLine].classList.remove("now"); curLine=k;
      if(k>=0){LINES[k].classList.add("now"); if(document.getElementById("tfollow").checked)LINES[k].scrollIntoView({block:"center",behavior:"smooth"});} } } };
a.onloadedmetadata=a.ontimeupdate;
let seeking=false;
seek.oninput=()=>{seeking=true; if(a.duration){a.currentTime=seek.value/100*a.duration;} };
seek.onchange=()=>seeking=false;
document.getElementById("back5").onclick=()=>a.currentTime=Math.max(0,a.currentTime-5);
document.querySelectorAll("#speeds button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#speeds button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");speed=+b.dataset.r;a.playbackRate=speed;a.preservesPitch=true;
});
// ---------- 校正模式 ----------
const ORIG=JSON.parse(JSON.stringify(TIMING));
function applyStarts(st,end){ // st: 每句開始時間；end: 最後一句結束
  for(let i=0;i<TIMING.length;i++){
    const s=st[i], e=(i+1<st.length?st[i+1]:end)-0.05;
    const o=ORIG[i], os=o[0], oe=o[1], sc=(e-s)/Math.max(0.1,oe-os);
    TIMING[i][0]=Math.max(0,s-0.05); TIMING[i][1]=e+0.1;
    TIMING[i][2]=o[2].map(([a,b])=>[+(s+(a-os)*sc).toFixed(2),+(s+(b-os)*sc).toFixed(2)]);
  }
}
try{const sv=JSON.parse(localStorage.getItem("ttd_cal")||"null"); if(sv&&sv.st&&sv.st.length===TIMING.length)applyStarts(sv.st,sv.end);}catch(e){}
const cal=document.getElementById("cal"),calMsg=document.getElementById("calMsg"),calNext=document.getElementById("calNext");
let marks=[];
function calShow(){
  const n=marks.length;
  if(n<SCRIPT.flat().length){ calMsg.textContent=`第 ${n+1} / ${TIMING.length} 句：聽到這句「一開口」就按`; calNext.textContent=SCRIPT.flat()[n][0]; document.getElementById("calTap").textContent="👆 這句開始了！"; }
  else { calMsg.textContent="最後一句念完時按一下"; calNext.textContent="（Thank you for listening! 結束）"; document.getElementById("calTap").textContent="✅ 全部念完了"; }
}
document.getElementById("calStart").onclick=()=>{
  marks=[]; clearSeg(); speedReset(); a.currentTime=0; a.play().catch(()=>{});
  cal.style.display="block"; document.getElementById("calOut").style.display="none"; document.getElementById("calCopy").style.display="none"; document.getElementById("calTap").style.display="";
  calShow();
};
function speedReset(){ /* 校正用目前速度即可，時間點以錄音時間記錄 */ }
document.getElementById("calTap").onclick=()=>{
  const t=+(a.currentTime-0.25).toFixed(2); // 扣掉反應時間
  if(marks.length<TIMING.length){ marks.push(Math.max(0,t)); calShow(); return; }
  const end=+(a.currentTime).toFixed(2); a.pause();
  applyStarts(marks,end);
  try{localStorage.setItem("ttd_cal",JSON.stringify({st:marks,end}));}catch(e){}
  calMsg.textContent="✅ 校正完成！已套用在這台裝置。若要讓其他裝置也準，請把下面資料複製貼給 Claude。";
  calNext.textContent=""; document.getElementById("calTap").style.display="none";
  const out=document.getElementById("calOut"); out.value="CAL:"+JSON.stringify({st:marks,end}); out.style.display="inline-block";
  document.getElementById("calCopy").style.display="inline-block";
};
document.getElementById("calUndo").onclick=()=>{ if(marks.length){ marks.pop(); const back=marks.length?marks[marks.length-1]:0; a.currentTime=Math.max(0,back-0.5); a.play().catch(()=>{}); calShow(); } };
document.getElementById("calCancel").onclick=()=>{ a.pause(); cal.style.display="none"; };
document.getElementById("calReset").onclick=()=>{ for(let i=0;i<TIMING.length;i++){TIMING[i][0]=ORIG[i][0];TIMING[i][1]=ORIG[i][1];TIMING[i][2]=JSON.parse(JSON.stringify(ORIG[i][2]));} try{localStorage.removeItem("ttd_cal");}catch(e){} a.pause(); cal.style.display="none"; };
document.getElementById("calCopy").onclick=()=>{ const o=document.getElementById("calOut"); o.select(); navigator.clipboard&&navigator.clipboard.writeText(o.value).catch(()=>{}); document.getElementById("calCopy").textContent="✅ 已複製（也可以手動長按全選）"; };
document.getElementById("gear").onclick=()=>document.getElementById("settings").classList.toggle("open");
document.getElementById("tzh").onchange=e=>document.body.classList.toggle("nozh",!e.target.checked);
document.getElementById("tcue").onchange=e=>document.body.classList.toggle("nocue",!e.target.checked);
</script>
</body>
